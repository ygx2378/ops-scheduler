name: Monthly full snapshots and sitemap

on:
  schedule:
    - cron: "30 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D1_DATABASE_NAME: ${{ secrets.CATALOG_D1_DATABASE }}
      R2_BUCKET_NAME: ${{ secrets.CATALOG_R2_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out private source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Apple refresh tables
        run: npm run apple:prices:init -- --remote

      - name: Refresh full D1 rankings, R2 snapshots, and sitemap source
        run: npm run r2:refresh-monthly-full-snapshots

      - name: Generate all static build inputs
        run: |
          npm run static:generate-page-snapshots
          npm run static:generate-fast-data
          npm run seo:generate-plan-routes
          npm run static:generate-app-detail-snapshots

      - name: Build Cloudflare worker and static pages
        run: npm run cf:build

      - name: Deploy refreshed static pages and sitemap
        run: npm run cf:deploy

      - name: Prewarm public pages
        run: npm run cf:prewarm

      - name: Commit refreshed static build inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-data/static-page-snapshots.json src/lib/catalog/static-app-routes.ts src/lib/catalog/static-fast-data.ts src/lib/catalog/static-plan-routes.ts src/lib/catalog/app-detail-snapshots.json
          git add -u data/r2-snapshots
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh monthly static snapshots"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
