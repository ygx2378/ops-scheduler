name: Publish static per-App price assets

on:
  schedule:
    - cron: "35 * * * *"
    - cron: "15 4 * * 0"
  workflow_dispatch:
    inputs:
      manifest_key:
        description: "Optional immutable R2 manifest key; empty uses price-assets/latest.json"
        required: false
        default: ""
        type: string
      publish_mode:
        description: "immediate publishes due major events; cycle publishes all pending events"
        required: false
        default: immediate
        type: choice
        options:
          - immediate
          - cycle

permissions:
  contents: read

concurrency:
  group: price-static-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_BUCKET_NAME: ${{ secrets.PRICE_ASSETS_ARCHIVE_BUCKET }}
      D1_DATABASE_NAME: ${{ secrets.CATALOG_D1_DATABASE }}
      PRICE_ASSETS_WORKER_NAME: ${{ secrets.PRICE_ASSETS_WORKER_NAME }}
      PRICE_ASSETS_PUBLIC_URL: ${{ secrets.PRICE_ASSETS_PUBLIC_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_mode || (github.event.schedule == '15 4 * * 0' && 'cycle' || 'immediate') }}

    steps:
      - name: Check out private source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check publishing configuration
        run: |
          set -euo pipefail
          test -n "${R2_BUCKET_NAME:-}"
          test -n "${PRICE_ASSETS_WORKER_NAME:-}"
          test -n "${PRICE_ASSETS_PUBLIC_URL:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Resolve latest immutable release
        id: latest
        env:
          INPUT_MANIFEST_KEY: ${{ inputs.manifest_key }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_MANIFEST_KEY:-}" ]]; then
            MANIFEST_KEY="$INPUT_MANIFEST_KEY"
          else
            npx wrangler r2 object get "$R2_BUCKET_NAME/price-assets/latest.json" --remote --file "$RUNNER_TEMP/latest.json"
            MANIFEST_KEY=$(jq -er '.manifestKey' "$RUNNER_TEMP/latest.json")
          fi
          npx wrangler r2 object get "$R2_BUCKET_NAME/$MANIFEST_KEY" --remote --file "$RUNNER_TEMP/target-manifest.json"
          RELEASE_ID=$(jq -er '.releaseId' "$RUNNER_TEMP/target-manifest.json")
          APP_COUNT=$(jq -er '.appCount' "$RUNNER_TEMP/target-manifest.json")
          echo "manifest_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "target_app_count=$APP_COUNT" >> "$GITHUB_OUTPUT"

      - name: Compare currently deployed release
        id: compare
        run: |
          set -euo pipefail
          CURRENT_RELEASE=unknown
          if curl --fail --silent --show-error --max-time 30 "$PRICE_ASSETS_PUBLIC_URL/v1/manifest.json" > "$RUNNER_TEMP/current-manifest.json"; then
            CURRENT_RELEASE=$(jq -r '.releaseId // "unknown"' "$RUNNER_TEMP/current-manifest.json")
          fi
          TARGET_RELEASE='${{ steps.latest.outputs.release_id }}'
          if [[ "$CURRENT_RELEASE" == "$TARGET_RELEASE" ]]; then
            CHANGED=false
          else
            CHANGED=true
          fi
          echo "current_release=$CURRENT_RELEASE"
          echo "target_release=$TARGET_RELEASE"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Download and verify immutable release
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm run prices:archive:download -- \
            --manifest-key='${{ steps.latest.outputs.manifest_key }}' \
            --out="$RUNNER_TEMP/price-assets"
          npm run prices:validate -- --dir="$RUNNER_TEMP/price-assets"

      - name: Publish static price Worker
        if: steps.compare.outputs.changed == 'true'
        run: npm run prices:publish -- --dir="$RUNNER_TEMP/price-assets" --target=production --name="$PRICE_ASSETS_WORKER_NAME"

      - name: Verify deployed release and representative App
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$PRICE_ASSETS_PUBLIC_URL/v1/manifest.json" > "$RUNNER_TEMP/deployed-manifest.json"
          jq -e --arg release '${{ steps.latest.outputs.release_id }}' '.releaseId == $release and .complete == true' "$RUNNER_TEMP/deployed-manifest.json"
          APP_ID=$(node -e "const z=require('node:zlib');const f=require('node:fs');const x=JSON.parse(z.gunzipSync(f.readFileSync(process.argv[1])));process.stdout.write(Object.keys(x.apps)[0])" "$RUNNER_TEMP/price-assets/v1/index.json.gz")
          curl --fail --silent --show-error --max-time 30 "$PRICE_ASSETS_PUBLIC_URL/v1/apps/$APP_ID.json" | jq -e --arg release '${{ steps.latest.outputs.release_id }}' '.releaseId == $release and (.products | length) > 0'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$PRICE_ASSETS_PUBLIC_URL/v1/apps/does-not-exist.json")" = 404

      - name: Record no-change result
        if: steps.compare.outputs.changed == 'false'
        run: echo "Static price release ${{ steps.latest.outputs.release_id }} is already live; no deployment performed."

      - name: Claim due official price events
        id: claim_events
        run: |
          set -euo pipefail
          RESULT=$(npm run apple:monitor:publish-state -- claim --remote --publish-mode "$PUBLISH_MODE" | tail -n 1)
          echo "$RESULT"
          echo "claimed=$(printf '%s' "$RESULT" | jq -r '.claimed // false')" >> "$GITHUB_OUTPUT"
          echo "batch_id=$(printf '%s' "$RESULT" | jq -r '.batchId // empty')" >> "$GITHUB_OUTPUT"

      - name: Apply and publish official price event batch
        id: event_release
        if: steps.claim_events.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          EVENTS_FILE="$RUNNER_TEMP/price-events.json"
          BASE_DIR="$RUNNER_TEMP/price-assets"
          if [[ ! -f "$BASE_DIR/v1/manifest.json.gz" ]]; then
            npm run prices:archive:download -- \
              --manifest-key='${{ steps.latest.outputs.manifest_key }}' \
              --out="$BASE_DIR"
            npm run prices:validate -- --dir="$BASE_DIR"
          fi
          npm run apple:monitor:publish-state -- export --remote \
            --batch-id='${{ steps.claim_events.outputs.batch_id }}' | tail -n 1 > "$EVENTS_FILE"
          npm run prices:apply-events -- \
            --base="$BASE_DIR" \
            --events="$EVENTS_FILE" \
            --batch-id='${{ steps.claim_events.outputs.batch_id }}' \
            --out="$RUNNER_TEMP/price-assets-event"
          npm run prices:validate -- --dir="$RUNNER_TEMP/price-assets-event"
          RELEASE_ID=$(node -e "const z=require('node:zlib');const f=require('node:fs');const x=JSON.parse(z.gunzipSync(f.readFileSync(process.argv[1])));process.stdout.write(x.releaseId)" "$RUNNER_TEMP/price-assets-event/v1/manifest.json.gz")
          npm run prices:archive -- \
            --dir="$RUNNER_TEMP/price-assets-event" \
            --out="$RUNNER_TEMP/${RELEASE_ID}.tar.gz"
          npm run prices:archive:upload -- \
            --archive="$RUNNER_TEMP/${RELEASE_ID}.tar.gz" \
            --transport=wrangler
          npm run prices:publish -- \
            --dir="$RUNNER_TEMP/price-assets-event" \
            --target=production \
            --name="$PRICE_ASSETS_WORKER_NAME"
          curl --fail --silent --show-error --max-time 30 \
            "$PRICE_ASSETS_PUBLIC_URL/v1/manifest.json" > "$RUNNER_TEMP/event-deployed-manifest.json"
          jq -e --arg release "$RELEASE_ID" \
            '.releaseId == $release and .complete == true and .patch == true' \
            "$RUNNER_TEMP/event-deployed-manifest.json"
          APP_ID=$(node -e "const z=require('node:zlib');const f=require('node:fs');const x=JSON.parse(z.gunzipSync(f.readFileSync(process.argv[1])));process.stdout.write(x.changedAppIds[0])" "$RUNNER_TEMP/price-assets-event/v1/manifest.json.gz")
          curl --fail --silent --show-error --max-time 30 \
            "$PRICE_ASSETS_PUBLIC_URL/v1/apps/$APP_ID.json" | \
            jq -e --arg release "$RELEASE_ID" '.releaseId == $release and (.products | length) > 0'
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Complete official price event batch
        if: always() && steps.claim_events.outputs.claimed == 'true' && steps.event_release.outcome == 'success'
        run: |
          npm run apple:monitor:publish-state -- complete --remote \
            --batch-id='${{ steps.claim_events.outputs.batch_id }}'

      - name: Requeue failed official price event batch
        if: always() && steps.claim_events.outputs.claimed == 'true' && steps.event_release.outcome == 'failure'
        env:
          PRICE_PUBLISH_ERROR: Static per-App price event release failed before readback
        run: |
          npm run apple:monitor:publish-state -- complete --remote \
            --batch-id='${{ steps.claim_events.outputs.batch_id }}' --failed
