name: Discover new Apple apps

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      D1_DATABASE_NAME: ${{ secrets.CATALOG_D1_DATABASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out private source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Apple refresh tables
        run: npm run apple:prices:init -- --remote

      - name: Discover new apps from Apple Top Charts
        id: discover
        run: |
          npm run apple:prices:discover -- --remote --countries us,jp,gb,de --kinds top-free,top-paid --discover-limit 50 --enqueue 2>&1 | tee /tmp/discover.log
          echo "newapps_count=$(grep -c '^NEWAPP' /tmp/discover.log || true)" >> "$GITHUB_OUTPUT"
          grep '^NEWAPP' /tmp/discover.log | awk -F'\t' '{printf "%d. %s (id%s) — %s\n", NR, $3, $2, $5}' > /tmp/newapps.txt || true

      - name: Notify new apps by email
        if: steps.discover.outputs.newapps_count != '0' && steps.discover.outputs.newapps_count != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[App Store monitor] 发现 ${{ steps.discover.outputs.newapps_count }} 个新 app"
          to: ${{ secrets.MAIL_TO }}
          from: "App price monitor <${{ secrets.SMTP_USER }}>"
          body: file:///tmp/newapps.txt
          convert_markdown: false
