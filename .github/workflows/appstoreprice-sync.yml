name: Sync appstoreprice data

# appstoreprice.org 详情页一次返回全地区 IAP 价格,作为主力价格源加速清除 crawl_jobs 积压。
# pool: 周一扫 sitemap 增量发现新 app; details: 每天抓详情页填全地区价。
on:
  schedule:
    - cron: "47 3 * * 1"
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      run_pool:
        description: "同时扫描 appstoreprice sitemap 增量 App"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: appstoreprice-sync
  cancel-in-progress: false

jobs:
  pool:
    if: github.event.schedule == '47 3 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.run_pool)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      D1_DATABASE_NAME: ${{ secrets.CATALOG_D1_DATABASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out private source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare tables
        run: npm run seed:appstoreprice:init -- --remote

      - name: Seed app pool from appstoreprice sitemap
        run: npm run seed:appstoreprice:pool -- --remote

  details:
    if: github.event.schedule == '17 14 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      D1_DATABASE_NAME: ${{ secrets.CATALOG_D1_DATABASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APPSTOREPRICE_BATCH: "20"
      APPSTOREPRICE_QUIET: "1"
    steps:
      - name: Check out private source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare tables
        run: npm run seed:appstoreprice:init -- --remote

      - name: Reset stale running jobs
        run: npm run seed:appstoreprice:reset-running -- --remote

      - name: Process appstoreprice detail pages
        run: npm run seed:appstoreprice:details -- --remote
